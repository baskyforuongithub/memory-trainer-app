<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1117">
<title>Number Memory Trainer</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0f1117;
    --panel:#1a1d27;
    --accent:#5b8cff;
    --accent2:#ff5b8c;
    --text:#f2f3f7;
    --muted:#9aa0b4;
    --good:#37c977;
    --bad:#ff5b6a;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg) !important; color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    overscroll-behavior:none;
    user-select:none; -webkit-user-select:none;
  }
  #app{
    min-height:100vh;
    min-height:100dvh;
    display:flex; flex-direction:column;
    background:var(--bg);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen{ flex:1; display:flex; flex-direction:column; padding:20px 18px 28px; background:var(--bg); }
  .hidden{ display:none !important; }

  h1{ font-size:22px; margin:6px 0 2px; text-align:center; letter-spacing:0.2px;}
  .subtitle{ text-align:center; color:var(--muted); font-size:13px; margin-bottom:18px; }

  .card{
    background:var(--panel); border-radius:var(--radius);
    padding:18px 18px; margin-bottom:16px;
    box-shadow:0 2px 14px rgba(0,0,0,0.25);
  }
  .row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .row label{ font-size:15px; font-weight:600; }
  .row .value{ font-size:15px; color:var(--accent); font-weight:700; min-width:54px; text-align:right;}

  input[type=range]{
    -webkit-appearance:none; width:100%; height:36px; background:transparent; margin:6px 0 2px;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:8px; border-radius:6px; background:linear-gradient(90deg,var(--accent),#2a2f42);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:28px; height:28px; border-radius:50%;
    background:#fff; border:4px solid var(--accent); margin-top:-10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.4);
  }

  .toggle-group{ display:flex; background:#12141c; border-radius:14px; padding:4px; margin-top:6px; }
  .toggle-btn{
    flex:1; text-align:center; padding:12px 8px; border-radius:11px; font-weight:700; font-size:14px;
    color:var(--muted); cursor:pointer; transition:all .15s ease;
  }
  .toggle-btn.active{ background:var(--accent); color:#fff; }

  .big-btn{
    display:block; width:100%; padding:16px; border:none; border-radius:16px;
    background:var(--accent); color:#fff; font-size:18px; font-weight:800;
    letter-spacing:0.3px; margin-top:4px;
  }
  .big-btn:active{ opacity:0.8; }
  .big-btn.secondary{ background:#2a2f42; color:var(--text); }
  .big-btn.danger{ background:var(--bad); }
  .btn-row{ display:flex; gap:10px; }
  .btn-row .big-btn{ flex:1; }

  .note{ font-size:12px; color:var(--muted); line-height:1.5; margin-top:10px; }

  /* Flash screen */
  #flash-screen{ justify-content:space-between; }
  .top-bar{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); }
  .flash-center{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
  .flash-number{
    font-size:min(28vw,140px); font-weight:900; line-height:1; letter-spacing:2px;
    color:#ffffff !important; -webkit-text-fill-color:#ffffff; opacity:1;
    background:#05060a; padding:18px 34px; border-radius:24px;
    box-shadow:0 8px 30px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(255,255,255,0.06);
  }
  .flash-word{ font-size:28px; font-weight:800; color:var(--accent); letter-spacing:1px; }
  .flash-image{ max-width:70vw; max-height:28vh; border-radius:14px; box-shadow:0 6px 24px rgba(0,0,0,0.4); }
  .mic-status{ font-size:14px; color:var(--muted); display:flex; align-items:center; gap:8px; min-height:22px; }
  .mic-dot{ width:10px; height:10px; border-radius:50%; background:#555; }
  .mic-dot.live{ background:var(--bad); box-shadow:0 0 0 0 rgba(255,91,106,0.6); animation:pulse 1s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(255,91,106,0.55);} 70%{box-shadow:0 0 0 10px rgba(255,91,106,0);} 100%{box-shadow:0 0 0 0 rgba(255,91,106,0);} }
  .progress-track{ width:100%; height:6px; background:#242838; border-radius:4px; overflow:hidden; margin-top:10px;}
  .progress-fill{ height:100%; background:var(--accent); width:0%; transition:width .15s linear; }

  /* Review screen */
  .score-banner{ text-align:center; padding:14px; border-radius:16px; background:var(--panel); margin-bottom:14px; }
  .score-banner .big{ font-size:34px; font-weight:900; }
  #review-list{ overflow-y:auto; flex:1; }
  .review-item{
    display:flex; align-items:center; gap:12px; background:var(--panel);
    border-radius:14px; padding:10px 12px; margin-bottom:8px;
  }
  .review-item img{ width:52px; height:52px; object-fit:cover; border-radius:10px; flex-shrink:0; background:#222; }
  .review-num{ font-size:20px; font-weight:800; width:34px; flex-shrink:0; }
  .review-mid{ flex:1; min-width:0; }
  .review-word{ font-weight:700; font-size:15px; }
  .review-spoken{ font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .review-badge{ font-size:20px; flex-shrink:0; }
  .review-badge.correct{ color:var(--good); }
  .review-badge.incorrect{ color:var(--bad); }
</style>
</head>
<body>
<div id="app">

  <!-- SETUP SCREEN -->
  <div id="setup-screen" class="screen">
    <h1>🧠 Number Memory Trainer</h1>
    <div class="subtitle">00–99 phonic image recall</div>

    <div class="card">
      <div class="row"><label>How many numbers</label><span class="value" id="countVal">20</span></div>
      <input type="range" id="countSlider" min="5" max="100" step="1" value="20">
    </div>

    <div class="card">
      <div class="row"><label>Flash interval</label><span class="value" id="intervalVal">3.0s</span></div>
      <input type="range" id="intervalSlider" min="5" max="60" step="1" value="30">
    </div>

    <div class="card" id="micCard">
      <div class="row" style="margin-bottom:10px;"><label>Mode</label></div>
      <div class="toggle-group">
        <div class="toggle-btn active" id="modeLearning" data-mode="learning">📖 Learning<br><span style="font-weight:400;font-size:11px;">number + image + word</span></div>
        <div class="toggle-btn" id="modeTest" data-mode="test">🎯 Test<br><span style="font-weight:400;font-size:11px;">number only, speak the word</span></div>
      </div>
      <div class="note" id="modeNote">Shows the number, image and word together so you can build the association.</div>
      <button class="big-btn secondary hidden" id="micCheckBtn" style="margin-top:12px;">🎙️ Check microphone access</button>
      <div class="note" id="micCheckResult"></div>
    </div>

    <button class="big-btn" id="startBtn">Start Session</button>
    <div class="note" id="speechSupportNote"></div>
  </div>

  <!-- FLASH SCREEN -->
  <div id="flash-screen" class="screen hidden">
    <div class="top-bar">
      <span id="progressLabel">1 / 20</span>
      <span id="modeLabel">LEARNING</span>
    </div>
    <div class="flash-center">
      <div class="flash-number" id="flashNumber">00</div>
      <img class="flash-image hidden" id="flashImage" src="">
      <div class="flash-word hidden" id="flashWord"></div>
      <div class="mic-status hidden" id="micStatus"><span class="mic-dot" id="micDot"></span><span id="micText">Listening…</span></div>
    </div>
    <div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="btn-row" style="margin-top:14px;">
        <button class="big-btn secondary" id="pauseBtn">Pause</button>
        <button class="big-btn danger" id="stopBtn">Stop</button>
      </div>
    </div>
  </div>

  <!-- REVIEW SCREEN -->
  <div id="review-screen" class="screen hidden">
    <h1 style="margin-bottom:10px;">Session Review</h1>
    <div class="score-banner" id="scoreBanner">
      <div class="big" id="scoreBig">20/20</div>
      <div class="note" id="scoreSub" style="margin-top:2px;">numbers shown</div>
    </div>
    <div id="review-list"></div>
    <div class="btn-row" style="margin-top:14px;">
      <button class="big-btn secondary" id="restartBtn">Same Settings</button>
      <button class="big-btn" id="backBtn">Back to Setup</button>
    </div>
  </div>

</div>

const ALL_KEYS = Object.keys(WORDS).sort();

// ---------- state ----------
let config = { count:20, interval:3.0, mode:'learning' };
let sequence = [];
let currentIndex = -1;
let results = [];
let stepTimer = null;
let paused = false;
let remainingMs = 0;
let stepStart = 0;
let recognition = null;
let speechSupported = ('webkitSpeechRecognition' in window) || ('SpeechRecognition' in window);
let lastHeard = '';
let micPermissionOK = false;
let micProblemReason = ''; // 'insecure' | 'denied' | ''
let listeningActive = false;   // legacy flag, unused now but kept for compatibility
let pendingSpeechIndex = null; // legacy, unused now
let utteranceIndexMap = {};    // legacy, unused now
let stopTimer = null;          // fires just before this number's interval ends -> recognition.stop()
let safetyTimer = null;        // fallback if recognition.onend never fires
let cycleHeard = '';           // transcript captured for the CURRENT number's listen window
let micCycleFinished = false;  // guards against onend + safetyTimer both firing for one cycle
let sessionRunning = false;    // true while a session (learning or test) is actively in progress

// ---------- elements ----------
const el = (id)=>document.getElementById(id);
const countSlider = el('countSlider'), countVal = el('countVal');
const intervalSlider = el('intervalSlider'), intervalVal = el('intervalVal');
const modeLearning = el('modeLearning'), modeTest = el('modeTest'), modeNote = el('modeNote');
const startBtn = el('startBtn');
const setupScreen = el('setup-screen'), flashScreen = el('flash-screen'), reviewScreen = el('review-screen');
const flashNumber = el('flashNumber'), flashImage = el('flashImage'), flashWord = el('flashWord');
const micStatus = el('micStatus'), micDot = el('micDot'), micText = el('micText');
const progressLabel = el('progressLabel'), modeLabel = el('modeLabel'), progressFill = el('progressFill');
const pauseBtn = el('pauseBtn'), stopBtn = el('stopBtn');

if(!speechSupported){
  el('speechSupportNote').textContent = "Note: voice recognition isn't available in this browser, so Test mode will just flash numbers for silent recall (no auto-scoring).";
} else if(!window.isSecureContext){
  el('speechSupportNote').textContent = "⚠️ This page was opened as a local file (file://). iPhone Safari blocks microphone access on local files, so Test mode voice scoring won't hear you — it'll fall back to silent recall. To enable voice scoring, host this file somewhere with https:// (see instructions from Claude) and open it from that link instead.";
}

// ---------- setup interactions ----------
countSlider.addEventListener('input', ()=>{ config.count = parseInt(countSlider.value); countVal.textContent = config.count; });
intervalSlider.addEventListener('input', ()=>{
  config.interval = parseInt(intervalSlider.value)/10;
  intervalVal.textContent = config.interval.toFixed(1)+'s';
});
function setMode(mode){
  config.mode = mode;
  modeLearning.classList.toggle('active', mode==='learning');
  modeTest.classList.toggle('active', mode==='test');
  modeNote.textContent = mode==='learning'
    ? "Shows the number, image and word together so you can build the association."
    : "Shows only the number. Say the word out loud" + (speechSupported ? " — your mic answer is auto-checked (voice recognition needs a beat to process, so 3s+ intervals work best)." : " (voice checking unavailable here, use it for silent self-recall).");
  el('micCheckBtn').classList.toggle('hidden', !(mode==='test' && speechSupported));
  if(mode!=='test') el('micCheckResult').textContent = '';
}
el('micCheckBtn').addEventListener('click', async ()=>{
  el('micCheckResult').textContent = 'Checking…';
  el('micCheckResult').style.whiteSpace = 'pre-line';
  // Query-only first: this does NOT trigger a browser prompt, so tapping this
  // button doesn't create a separate mic "grant" from the one Start Session
  // will actually use — avoiding a second, redundant prompt later.
  const permState = await queryMicPermissionState();
  if(permState==='granted'){
    el('micCheckResult').textContent = "✅ Microphone is already allowed for this site. Voice scoring is ready to go.";
    return;
  }
  if(permState==='denied'){
    el('micCheckResult').textContent = micGuidance('denied', null, permState);
    return;
  }
  if(!window.isSecureContext || !navigator.mediaDevices){
    el('micCheckResult').textContent = micGuidance('insecure', null, permState);
    return;
  }
  // Permission state is 'prompt' or unknown (Permissions API unsupported) —
  // the only way to find out for sure is to actually ask, so this path may
  // show the real browser prompt (once).
  const result = await ensureMicPermission();
  el('micCheckResult').textContent = result.ok
    ? "✅ Microphone access granted. Voice scoring is ready to go."
    : micGuidance(result.reason, result.errName, permState);
});
modeLearning.addEventListener('click', ()=>setMode('learning'));
modeTest.addEventListener('click', ()=>setMode('test'));
countVal.textContent = config.count;
intervalVal.textContent = config.interval.toFixed(1)+'s';

startBtn.addEventListener('click', startSession);

// ---------- helpers ----------
function shuffledKeys(){
  const arr = ALL_KEYS.slice();
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
// True no-repeat sequence: if count <= 100 every number is unique (one shuffle).
// If count > 100 (more numbers than exist), we cycle through fresh shuffles,
// only reshuffling the boundary so the same number never appears twice in a row.
function randomSequence(n){
  let seq = [];
  while(seq.length < n){
    let batch = shuffledKeys();
    if(seq.length>0 && batch[0]===seq[seq.length-1]){
      const idx = 1 + Math.floor(Math.random()*(batch.length-1));
      [batch[0],batch[idx]] = [batch[idx],batch[0]];
    }
    seq = seq.concat(batch);
  }
  return seq.slice(0,n);
}
function normalize(s){
  return (s||'').toLowerCase().replace(/[^a-z]/g,'');
}
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(m===0) return n; if(n===0) return m;
  const dp = Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
    }
  }
  return dp[m][n];
}
function isMatch(expected, heard){
  const e = normalize(expected);
  const h = normalize(heard);
  if(!h) return false;
  if(h===e) return true;
  if(h.includes(e) || e.includes(h)) return true;
  return levenshtein(e,h) <= Math.max(1, Math.floor(e.length*0.25));
}

// ---------- mic permission ----------
async function queryMicPermissionState(){
  if(navigator.permissions && navigator.permissions.query){
    try{
      const status = await navigator.permissions.query({ name:'microphone' });
      return status.state; // 'granted' | 'denied' | 'prompt'
    }catch(e){ return null; } // Safari on this OS version may not support querying 'microphone'
  }
  return null;
}
async function ensureMicPermission(){
  if(!window.isSecureContext) return { ok:false, reason:'insecure' };
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return { ok:false, reason:'insecure' };
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    stream.getTracks().forEach(t=>t.stop());
    return { ok:true };
  }catch(err){
    const name = err && err.name ? err.name : 'Unknown';
    let reason = 'denied';
    if(name==='NotFoundError' || name==='OverconstrainedError') reason = 'nodevice';
    else if(name==='NotAllowedError' || name==='PermissionDeniedError' || name==='SecurityError') reason = 'denied';
    else reason = 'other';
    return { ok:false, reason, errName:name };
  }
}
function micGuidance(reason, errName, permState){
  if(reason==='insecure'){
    return "⚠️ Mic blocked: this page isn't loaded over https:// (or you opened it as a local file). Host it somewhere with https and open it from that link.";
  }
  if(reason==='nodevice'){
    return "⚠️ No microphone was found. Check nothing else (another app/tab) is using it, then try again.";
  }
  if(reason==='denied'){
    const stuck = permState==='denied';
    let msg = stuck
      ? "⚠️ Confirmed: iOS has this site's microphone permanently set to Denied — that's why no popup ever appears; it auto-rejects. "
      : "⚠️ Microphone permission was denied. ";
    msg += "To reset it:\n";
    msg += "1) Tap the “aA” icon in Safari's address bar → Website Settings → set Microphone to Allow (or Ask), then reload.\n";
    msg += "2) If “aA” → Website Settings doesn't show Microphone, go to the Settings app → Safari → scroll to Settings for Websites → Microphone → set to Ask.\n";
    msg += "3) Also check Settings app → Privacy & Security → Microphone → make sure Safari (or Safari Technology Preview) is toggled ON.\n";
    msg += "Then come back and tap “Check microphone access” again.";
    return msg;
  }
  return "⚠️ Microphone access failed" + (errName? (' ('+errName+')') : '') + ". Test mode will fall back to silent recall.";
}

// ---------- session flow ----------
async function startSession(){
  sequence = randomSequence(config.count);
  currentIndex = -1;
  results = [];
  paused = false;
  sessionRunning = true;
  setupScreen.classList.add('hidden');
  reviewScreen.classList.add('hidden');
  flashScreen.classList.remove('hidden');
  modeLabel.textContent = config.mode==='learning' ? 'LEARNING' : 'TEST';

  micPermissionOK = false;
  micProblemReason = '';
  recognition = null;

  if(config.mode==='test' && speechSupported){
    if(!window.isSecureContext || !navigator.mediaDevices){
      micProblemReason = 'insecure';
    } else {
      // Optimistic: we won't know for certain until the first recognition.start()
      // actually succeeds or fails — corrected below via onerror if it's blocked.
      micPermissionOK = true;
      recognition = createTestRecognizer();
    }
  }
  nextStep();
}

function nextStep(){
  clearTimeout(stepTimer);
  currentIndex++;
  if(currentIndex >= sequence.length){
    finishSession();
    return;
  }
  const key = sequence[currentIndex];
  progressLabel.textContent = (currentIndex+1)+' / '+sequence.length;
  progressFill.style.width = (((currentIndex)/sequence.length)*100)+'%';
  flashNumber.textContent = key;
  lastHeard = '';

  if(config.mode==='learning'){
    flashImage.src = IMAGES[key];
    flashImage.classList.remove('hidden');
    flashWord.textContent = WORDS[key];
    flashWord.classList.remove('hidden');
    micStatus.classList.add('hidden');
    stepStart = Date.now();
    remainingMs = config.interval*1000;
    scheduleAdvance(remainingMs);
    return;
  }

  flashImage.classList.add('hidden');
  flashWord.classList.add('hidden');
  if(speechSupported && micPermissionOK){
    micStatus.classList.remove('hidden');
    beginMicCycle();
  } else {
    if(speechSupported && micProblemReason){
      micStatus.classList.remove('hidden');
      micDot.classList.remove('live');
      micText.textContent = micProblemReason==='insecure' ? 'Mic blocked: page not opened over https'
        : micProblemReason==='nodevice' ? 'No microphone found'
        : micProblemReason==='denied' ? 'Mic permission denied — recall silently'
        : 'Mic unavailable — recall silently';
    } else {
      micStatus.classList.add('hidden');
    }
    stepStart = Date.now();
    remainingMs = config.interval*1000;
    scheduleAdvance(remainingMs);
  }
}

// Plain fixed-delay advance — used for Learning mode, and for Test mode
// when voice capture isn't available (silent recall fallback).
function scheduleAdvance(ms){
  clearTimeout(stepTimer);
  stepTimer = setTimeout(()=>{
    if(config.mode==='test'){
      results.push({ key: sequence[currentIndex], spoken:lastHeard, correct: isMatch(WORDS[sequence[currentIndex]], lastHeard) });
    } else {
      results.push({ key: sequence[currentIndex], spoken:'', correct:null });
    }
    nextStep();
  }, ms);
}

// ---------- per-number speech recognition (one reused recognizer object) ----------
// A single SpeechRecognition object is created ONCE per test session and
// reused for every number via start()/stop() — never recreated — so the
// browser only ever asks for mic permission once. Each number gets its own
// tight listening window: we start() the instant it's shown, and stop()
// a moment before its interval ends (so the recognizer has time to finalize
// and we can move on right on schedule), exactly bounded to that number.
const STOP_BUFFER_MS = 250;  // stop listening this much before the interval ends
const SAFETY_PAD_MS = 1500;  // force-advance if the recognizer never reports back

function createTestRecognizer(){
  const SR = window.webkitSpeechRecognition || window.SpeechRecognition;
  const rec = new SR();
  rec.lang = 'en-US';
  rec.continuous = false;
  rec.interimResults = true;
  rec.maxAlternatives = 3;
  rec.onresult = (e)=>{
    const res = e.results[e.results.length-1];
    let heard = '';
    for(let j=0;j<res.length;j++) heard += ' ' + res[j].transcript;
    cycleHeard = heard.trim();
    if(sessionRunning && !paused && currentIndex<sequence.length){
      micText.textContent = 'Heard: "'+cycleHeard+'"';
    }
  };
  rec.onerror = (e)=>{
    const errName = e && e.error ? e.error : 'unknown';
    if(errName==='not-allowed' || errName==='service-not-allowed'){
      micPermissionOK = false;
      micProblemReason = 'denied';
    }
    // onend always follows onerror, which is what actually advances the cycle.
  };
  rec.onend = ()=>{
    micDot.classList.remove('live');
    if(paused || !sessionRunning) return; // abort() during pause/stop also fires onend — ignore it
    finishMicCycle();
  };
  return rec;
}

function beginMicCycle(){
  clearTimeout(stopTimer); clearTimeout(safetyTimer);
  cycleHeard = '';
  micCycleFinished = false;
  micDot.classList.add('live');
  micText.textContent = 'Listening…';
  try{
    recognition.start();
  }catch(err){
    // e.g. a rare "already started" race — don't hang the session, just move on.
    finishMicCycle();
    return;
  }
  const ms = config.interval*1000;
  stopTimer = setTimeout(()=>{
    try{ recognition.stop(); }catch(e){}
  }, Math.max(200, ms - STOP_BUFFER_MS));
  safetyTimer = setTimeout(()=>{ finishMicCycle(); }, ms + SAFETY_PAD_MS);
}

// Resolves the current number's listen window (from recognition.onend, or the
// safety timer if that never fires) then advances to the next number.
function finishMicCycle(){
  if(micCycleFinished) return;
  micCycleFinished = true;
  clearTimeout(stopTimer); clearTimeout(safetyTimer);
  if(currentIndex>=0 && currentIndex<sequence.length){
    results.push({ key: sequence[currentIndex], spoken:cycleHeard, correct: isMatch(WORDS[sequence[currentIndex]], cycleHeard) });
  }
  nextStep();
}

// Writes a heard answer to the right slot (kept for the plain-timer path above).
function recordAnswerFor(idx, key, heard){
  if(idx < results.length){
    results[idx].spoken = heard;
    results[idx].correct = isMatch(WORDS[key], heard);
  } else if(idx === currentIndex){
    lastHeard = heard;
    micText.textContent = 'Heard: "'+heard+'"';
  }
}

pauseBtn.addEventListener('click', ()=>{
  if(!paused){
    paused = true;
    clearTimeout(stepTimer);
    clearTimeout(stopTimer);
    clearTimeout(safetyTimer);
    if(recognition){ try{ recognition.abort(); }catch(e){} }
    micDot.classList.remove('live');
    remainingMs = remainingMs - (Date.now()-stepStart);
    pauseBtn.textContent = 'Resume';
  } else {
    paused = false;
    pauseBtn.textContent = 'Pause';
    stepStart = Date.now();
    if(config.mode==='test' && speechSupported && micPermissionOK && recognition){
      beginMicCycle();
    } else {
      scheduleAdvance(Math.max(300, remainingMs));
    }
  }
});
stopBtn.addEventListener('click', ()=>{
  clearTimeout(stepTimer);
  clearTimeout(stopTimer);
  clearTimeout(safetyTimer);
  sessionRunning = false;
  if(recognition){ try{ recognition.onresult=null; recognition.onerror=null; recognition.onend=null; recognition.abort(); }catch(e){} }
  micDot.classList.remove('live');
  finishSession();
});

function finishSession(){
  clearTimeout(stepTimer);
  clearTimeout(stopTimer);
  clearTimeout(safetyTimer);
  sessionRunning = false;
  if(recognition){ try{ recognition.onresult=null; recognition.onerror=null; recognition.onend=null; recognition.abort(); }catch(e){} }
  micDot.classList.remove('live');
  flashScreen.classList.add('hidden');
  reviewScreen.classList.remove('hidden');
  renderReview();
}

function renderReview(){
  const list = el('review-list');
  list.innerHTML = '';
  if(config.mode==='test'){
    const correctCount = results.filter(r=>r.correct).length;
    el('scoreBig').textContent = correctCount+' / '+results.length;
    el('scoreSub').textContent = 'correct recalls';
  } else {
    el('scoreBig').textContent = results.length;
    el('scoreSub').textContent = 'numbers reviewed';
  }
  results.forEach(r=>{
    const div = document.createElement('div');
    div.className = 'review-item';
    const badge = r.correct===null ? '' : (r.correct ? '<span class="review-badge correct">✔</span>' : '<span class="review-badge incorrect">✘</span>');
    div.innerHTML = `
      <img src="${IMAGES[r.key]}">
      <div class="review-num">${r.key}</div>
      <div class="review-mid">
        <div class="review-word">${WORDS[r.key]}</div>
        ${config.mode==='test' ? `<div class="review-spoken">you said: ${r.spoken? r.spoken : '(nothing heard)'}</div>` : ''}
      </div>
      ${badge}
    `;
    list.appendChild(div);
  });
}

el('restartBtn').addEventListener('click', startSession);
el('backBtn').addEventListener('click', ()=>{
  reviewScreen.classList.add('hidden');
  setupScreen.classList.remove('hidden');
});
</script>
